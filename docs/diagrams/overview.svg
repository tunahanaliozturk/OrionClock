<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="490" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionClock - packages and how the app reaches them</text>
  <text class="subtitle" x="40" y="78">One clock is both a TimeProvider and the family's IOrionClock; tests swap the time source underneath it.</text>

  <!-- app -->
  <rect class="step" x="40" y="130" width="250" height="90" rx="14"/>
  <text class="label" x="165" y="162" text-anchor="middle">Your app</text>
  <text class="small" x="165" y="184" text-anchor="middle">and the Orion packages it uses</text>
  <text class="small" x="165" y="204" text-anchor="middle">inject IOrionClock or TimeProvider</text>

  <path class="flow" d="M290,175 L338,175"/>

  <!-- registration -->
  <rect class="step" x="340" y="130" width="240" height="90" rx="14"/>
  <text class="code" x="460" y="166" text-anchor="middle" style="font-variant-ligatures: none">AddOrionClock(o =&gt; ...)</text>
  <text class="small" x="460" y="190" text-anchor="middle">TryAdd: an earlier registration wins</text>

  <path class="flow" d="M580,175 L638,175"/>

  <!-- clock -->
  <rect class="step" x="640" y="130" width="230" height="90" rx="14"/>
  <text class="label" x="755" y="162" text-anchor="middle">OrionClock</text>
  <text class="small" x="755" y="184" text-anchor="middle">a TimeProvider and an IOrionClock</text>
  <text class="small" x="755" y="204" text-anchor="middle">one instance for all three types</text>

  <path class="flow" d="M870,175 L968,175"/>
  <text class="edge" x="919" y="165" text-anchor="middle">implements</text>

  <!-- abstractions -->
  <rect class="ext" x="970" y="130" width="200" height="90" rx="14"/>
  <text class="label" x="1070" y="166" text-anchor="middle">Orion.Abstractions</text>
  <text class="small" x="1070" y="190" text-anchor="middle">IOrionClock, OrionOptions</text>

  <!-- Ttl / Deadline -->
  <path class="flow" d="M165,220 L165,288"/>
  <text class="edge" x="177" y="258">captured against the clock</text>
  <rect class="step" x="40" y="290" width="520" height="90" rx="14"/>
  <text class="label" x="300" y="320" text-anchor="middle">Ttl and Deadline values</text>
  <text class="code" x="300" y="343" text-anchor="middle">clock.TtlFor(duration)   clock.Deadline(timeout)</text>
  <text class="small" x="300" y="365" text-anchor="middle">IsExpired, Remaining, IsPast, TimeRemaining, ToCancellationTokenSource</text>

  <!-- inner providers -->
  <path class="flow" d="M725,220 L725,288"/>
  <text class="edge" x="737" y="258">default</text>
  <rect class="ext" x="600" y="290" width="250" height="90" rx="14"/>
  <text class="label" x="725" y="322" text-anchor="middle">TimeProvider.System</text>
  <text class="small" x="725" y="346" text-anchor="middle">production time source</text>

  <path class="flow" d="M840,220 L840,250 L1035,250 L1035,288"/>
  <text class="edge" x="947" y="242" text-anchor="middle">tests</text>
  <rect class="ext" x="900" y="290" width="270" height="90" rx="14"/>
  <text class="label" x="1035" y="322" text-anchor="middle">FakeTimeProvider</text>
  <text class="small" x="1035" y="344" text-anchor="middle">inside FakeOrionClock</text>
  <text class="small" x="1035" y="364" text-anchor="middle">package OrionClock.Testing</text>

  <!-- note -->
  <rect class="note" x="40" y="410" width="1130" height="50" rx="10"/>
  <text class="small" x="60" y="440">Every read (GetUtcNow, GetTimestamp, CreateTimer) delegates to the inner TimeProvider set in OrionClockOptions.TimeProvider (default: TimeProvider.System).</text>
</svg>
