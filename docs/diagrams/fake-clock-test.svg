<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="830" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionClock.Testing - expiring a TTL without waiting</text>
  <text class="subtitle" x="40" y="78">FakeOrionClock only moves when the test advances it, and advancing fires the timers created through it.</text>

  <!-- participants -->
  <rect class="step" x="40" y="104" width="180" height="56" rx="12"/>
  <text class="label" x="130" y="137" text-anchor="middle">Test</text>
  <rect class="ext" x="310" y="104" width="240" height="56" rx="12"/>
  <text class="label" x="430" y="137" text-anchor="middle">CancellationTokenSource</text>
  <rect class="step" x="640" y="104" width="220" height="56" rx="12"/>
  <text class="label" x="750" y="137" text-anchor="middle">FakeOrionClock</text>
  <rect class="ext" x="930" y="104" width="220" height="56" rx="12"/>
  <text class="label" x="1040" y="137" text-anchor="middle">FakeTimeProvider</text>

  <!-- lifelines -->
  <line class="lane" x1="130" y1="160" x2="130" y2="720"/>
  <line class="lane" x1="430" y1="160" x2="430" y2="720"/>
  <line class="lane" x1="750" y1="160" x2="750" y2="720"/>
  <line class="lane" x1="1040" y1="160" x2="1040" y2="720"/>

  <!-- 1 -->
  <path class="flow" d="M130,200 L748,200"/>
  <text class="edge" x="150" y="192">new FakeOrionClock()  - frozen at 2026-01-01Z</text>
  <!-- 2 -->
  <path class="flow" d="M130,245 L748,245"/>
  <text class="edge" x="150" y="237">clock.TtlFor(5 min) returns a Ttl</text>
  <!-- 3 -->
  <path class="flow" d="M130,290 L428,290"/>
  <text class="edge" x="150" y="282">ttl.ToCancellationTokenSource(clock)</text>
  <!-- 4 -->
  <path class="flow" d="M430,335 L748,335"/>
  <text class="edge" x="590" y="327" text-anchor="middle">CreateTimer(5 min)</text>
  <!-- 5 -->
  <path class="flow" d="M750,380 L1038,380"/>
  <text class="edge" x="895" y="372" text-anchor="middle">inner.CreateTimer</text>
  <!-- 6 -->
  <path class="flow" d="M130,425 L748,425"/>
  <text class="edge" x="150" y="417">clock.Advance(4 min)</text>
  <!-- 7 -->
  <path class="flow" d="M750,470 L1038,470"/>
  <text class="edge" x="895" y="462" text-anchor="middle">Advance: timer not due yet</text>
  <!-- 8 -->
  <path class="flow" d="M130,515 L748,515"/>
  <text class="edge" x="150" y="507">clock.Advance(2 min)  - now +6 min</text>
  <!-- 9 -->
  <path class="flow" d="M750,560 L1038,560"/>
  <text class="edge" x="895" y="552" text-anchor="middle">Advance: timer due at +5 min</text>
  <!-- 10 -->
  <path class="flow back" d="M1040,605 L432,605"/>
  <text class="edge" x="450" y="597">timer fires: token cancelled</text>
  <!-- 11 failure -->
  <path class="flow alt" d="M130,650 L748,650"/>
  <text class="edge" x="150" y="642">Advance(negative) or SetUtcNow(earlier instant)</text>
  <!-- 12 failure response -->
  <path class="flow alt" d="M750,695 L132,695"/>
  <text class="edge" x="150" y="687">throws ArgumentOutOfRangeException</text>

  <circle class="badge" cx="70" cy="200" r="12"/><text class="badge-text" x="70" y="204" text-anchor="middle">1</text>
  <circle class="badge" cx="70" cy="245" r="12"/><text class="badge-text" x="70" y="249" text-anchor="middle">2</text>
  <circle class="badge" cx="70" cy="290" r="12"/><text class="badge-text" x="70" y="294" text-anchor="middle">3</text>
  <circle class="badge" cx="70" cy="335" r="12"/><text class="badge-text" x="70" y="339" text-anchor="middle">4</text>
  <circle class="badge" cx="70" cy="380" r="12"/><text class="badge-text" x="70" y="384" text-anchor="middle">5</text>
  <circle class="badge" cx="70" cy="425" r="12"/><text class="badge-text" x="70" y="429" text-anchor="middle">6</text>
  <circle class="badge" cx="70" cy="470" r="12"/><text class="badge-text" x="70" y="474" text-anchor="middle">7</text>
  <circle class="badge" cx="70" cy="515" r="12"/><text class="badge-text" x="70" y="519" text-anchor="middle">8</text>
  <circle class="badge" cx="70" cy="560" r="12"/><text class="badge-text" x="70" y="564" text-anchor="middle">9</text>
  <circle class="badge" cx="70" cy="605" r="12"/><text class="badge-text" x="70" y="609" text-anchor="middle">10</text>
  <circle class="badge" cx="70" cy="650" r="12"/><text class="badge-text" x="70" y="654" text-anchor="middle">11</text>
  <circle class="badge" cx="70" cy="695" r="12"/><text class="badge-text" x="70" y="699" text-anchor="middle">12</text>

  <rect class="ok" x="40" y="740" width="700" height="60" rx="14"/>
  <text class="label" x="60" y="766">Deterministic, no real delay</text>
  <text class="small" x="60" y="787">After +4 min IsExpired(clock) is false; after +6 min it is true and the token is cancelled.</text>
</svg>
