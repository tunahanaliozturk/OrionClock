<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="590" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionClock - a TTL from issue to cancellation</text>
  <text class="subtitle" x="40" y="78">Deadline follows the same path: clock.Deadline(timeout), then IsPast, TimeRemaining and ToCancellationTokenSource.</text>

  <!-- issue -->
  <rect class="step" x="40" y="194" width="220" height="72" rx="14"/>
  <text class="code" x="150" y="226" text-anchor="middle">clock.TtlFor(duration)</text>
  <text class="small" x="150" y="248" text-anchor="middle">reads UtcNow once</text>

  <path class="flow" d="M260,230 L318,230"/>

  <polygon class="decision" points="430,170 540,230 430,290 320,230"/>
  <text class="code" x="430" y="235" text-anchor="middle" style="font-variant-ligatures: none">duration &lt; 0</text>

  <!-- failure -->
  <path class="flow alt" d="M430,170 L430,128 L618,128"/>
  <text class="edge" x="524" y="118" text-anchor="middle">yes</text>
  <rect class="fail" x="620" y="100" width="300" height="56" rx="14"/>
  <text class="label" x="770" y="133" text-anchor="middle">ArgumentOutOfRangeException</text>

  <!-- value -->
  <path class="flow" d="M540,230 L618,230"/>
  <text class="edge" x="579" y="220" text-anchor="middle">no</text>
  <rect class="step" x="620" y="185" width="280" height="90" rx="14"/>
  <text class="label" x="760" y="214" text-anchor="middle">Ttl value</text>
  <text class="code" x="760" y="238" text-anchor="middle">IssuedAt = now</text>
  <text class="code" x="760" y="260" text-anchor="middle">ExpiresAt = now + duration</text>

  <path class="flow" d="M900,230 L958,230"/>

  <rect class="step" x="960" y="185" width="210" height="90" rx="14"/>
  <text class="label" x="1065" y="214" text-anchor="middle">Check it</text>
  <text class="code" x="1065" y="238" text-anchor="middle">IsExpired(clock)</text>
  <text class="code" x="1065" y="260" text-anchor="middle">Remaining(clock)</text>

  <!-- to row 2 -->
  <path class="flow" d="M760,275 L760,330 L170,330 L170,380"/>

  <rect class="step" x="40" y="382" width="260" height="76" rx="14"/>
  <text class="code" x="170" y="414" text-anchor="middle">ToCancellationTokenSource</text>
  <text class="code" x="170" y="438" text-anchor="middle">(OrionClock clock)</text>

  <path class="flow" d="M300,420 L358,420"/>

  <polygon class="decision" points="480,358 600,420 480,482 360,420"/>
  <text class="code" x="480" y="416" text-anchor="middle" style="font-variant-ligatures: none">Remaining &gt; 0</text>
  <text class="small" x="480" y="436" text-anchor="middle">(TimeRemaining)</text>

  <path class="flow" d="M600,420 L658,420"/>
  <text class="edge" x="629" y="410" text-anchor="middle">yes</text>
  <rect class="step" x="660" y="382" width="260" height="76" rx="14"/>
  <text class="code" x="790" y="414" text-anchor="middle">new CancellationTokenSource</text>
  <text class="code" x="790" y="438" text-anchor="middle">(remaining, clock)</text>

  <path class="flow" d="M920,420 L958,420"/>
  <rect class="ok" x="960" y="382" width="210" height="76" rx="14"/>
  <text class="label" x="1065" y="414" text-anchor="middle">Token cancelled</text>
  <text class="small" x="1065" y="436" text-anchor="middle">when the clock's timer fires</text>

  <!-- already past -->
  <path class="flow" d="M480,482 L480,530 L658,530"/>
  <text class="edge" x="569" y="520" text-anchor="middle">no: already expired</text>
  <rect class="ok" x="660" y="500" width="260" height="60" rx="14"/>
  <text class="label" x="790" y="526" text-anchor="middle">Already-cancelled source</text>
  <text class="small" x="790" y="546" text-anchor="middle">returned at once, no timer</text>
</svg>
